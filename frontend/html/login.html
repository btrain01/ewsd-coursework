<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eTutor — Login</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .error-banner {
        background: #fee2e2;
        border: 1px solid #fecaca;
        color: #dc2626;
        font-size: 13px;
        padding: 10px 14px;
        border-radius: 6px;
        margin-bottom: 14px;
        display: none;
        text-align: left;
      }
      .container label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 4px;
        margin-top: 10px;
        color: rgba(255, 255, 255, 0.9);
      }
      .container input {
        margin: 0 0 4px 0;
      }
      .spinner {
        display: none;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: middle;
        margin-left: 6px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .brand {
        text-align: center;
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 4px;
      }
      .brand span {
        color: #cce0ff;
      }
      .tagline {
        text-align: center;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="brand">eTutor<span>Link</span></div>
      <div class="tagline">University eTutoring Platform</div>

      <h2>Sign In</h2>

      <div class="error-banner" id="errorBanner"></div>

      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        placeholder="Enter your username"
        autocomplete="username"
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      />

      <button id="loginBtn" onclick="loginUser()" style="margin-top: 16px">
        Sign In
        <div class="spinner" id="spinner"></div>
      </button>

      <div class="link">
        Don't have an account? <a href="register.html">Register</a>
      </div>
    </div>

    <script>
      const API_BASE = "http://localhost:5188";

      // Role ID to dashboard mapping
      // Confirmed from database: 1=student, 2=tutor, 3=staff, 4=admin
      const ROLE_REDIRECTS = {
        STUDENT: "student-dashboard.html",
        TUTOR: "tutor-dashboard.html",
        STAFF: "staff-dashboard.html",
        ADMIN: "staff-dashboard.html",
      };

      async function loginUser() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) {
          showError("Please enter both your username and password.");
          return;
        }

        setLoading(true);
        hideError();

        try {
          const response = await fetch(`${API_BASE}/Authentication/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          if (response.ok) {
            const userToken = await response.json();

            // Save session to localStorage
            localStorage.setItem("currentUser", JSON.stringify(userToken));

            // Resolve roleId using workaround
            const roleId = resolveRoleId(userToken);

            console.log(`llll ${roleId}`);

            if (roleId && ROLE_REDIRECTS[roleId]) {
              window.location.href = ROLE_REDIRECTS[roleId];
            } else {
              showError(
                "Login successful but your role could not be determined. Please contact support.",
              );
              console.warn("Could not determine roleId. Token:", userToken);
            }
          } else if (response.status === 401) {
            showError("Invalid username or password. Please try again.");
          } else {
            showError("Something went wrong. Please try again later.");
          }
        } catch (err) {
          showError(
            "Unable to reach the server. Please check your connection.",
          );
          console.error("Login error:", err);
        }

        setLoading(false);
      }

      // Workaround: resolve roleId from multiple possible sources
      // Priority 1: roleName in token (once backend adds it)
      // Priority 2: roleId stored in localStorage during registration
      function resolveRoleId(userToken) {
        // Priority 1 — roleName from backend (ready for when partner adds it)
        const roles = userToken.role;

        if (roles.length >= 1) {
          const nameMap = ["STUDENT", "TUTOR", "STAFF", "ADMIN"];
          // const fromName = nameMap[roleName.toLowerCase()];
          const role = roles.find((r) => nameMap.includes(r.name));

          console.log("reached here 1234");
          if (role) return role.name;
        }

        console.log("reached here 123");

        
        // Priority 2 — roleId saved during registration
        const storedRoleId = localStorage.getItem("registeredRoleId");
        if (storedRoleId) {
          const idToName = { 1: "STUDENT", 2: "TUTOR", 3: "STAFF", 4: "ADMIN" };
          return idToName[parseInt(storedRoleId)];
        }
      }

      function setLoading(isLoading) {
        const btn = document.getElementById("loginBtn");
        const spinner = document.getElementById("spinner");
        btn.disabled = isLoading;
        btn.firstChild.textContent = isLoading ? "Signing in... " : "Sign In ";
        spinner.style.display = isLoading ? "inline-block" : "none";
      }

      function showError(msg) {
        const el = document.getElementById("errorBanner");
        el.textContent = msg;
        el.style.display = "block";
      }

      function hideError() {
        document.getElementById("errorBanner").style.display = "none";
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") loginUser();
      });
    </script>
  </body>
</html>
