<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eTutor — Blog</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --blue: #1a56db; --blue-dark: #1a3a6b; --blue-bg: #e8f0fe;
        --white: #ffffff; --gray-50: #f8fafc; --gray-100: #f1f5f9;
        --gray-200: #e2e8f0; --gray-300: #d1d5db; --gray-400: #94a3b8;
        --gray-500: #6b7280; --gray-700: #374151; --gray-800: #1f2937;
        --green: #16a34a; --green-bg: #dcfce7; --amber: #d97706;
        --amber-bg: #fef3c7; --red: #dc2626; --red-bg: #fee2e2;
        --sidebar-w: 240px; --header-h: 60px; --radius: 12px;
        --shadow: 0 1px 4px rgba(0,0,0,.07); --shadow-md: 0 4px 16px rgba(0,0,0,.10);
      }
      body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--gray-100); color: var(--gray-800); min-height: 100vh; }
      .layout { display: flex; min-height: 100vh; }
      .sidebar { width: var(--sidebar-w); background: var(--white); border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform .25s ease; }
      .sidebar-profile { padding: 24px 20px 20px; display: flex; flex-direction: column; align-items: center; border-bottom: 1px solid var(--gray-200); }
      .profile-pic { width: 72px; height: 72px; border-radius: 50%; background: var(--blue-bg); border: 3px solid var(--blue); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
      .profile-pic svg { color: var(--blue); }
      .profile-name { font-size: 14px; font-weight: 700; }
      .profile-role { font-size: 11px; color: var(--gray-500); margin-top: 2px; }
      .btn-profile { margin-top: 12px; padding: 6px 20px; background: var(--blue); color: var(--white); font-size: 12px; font-weight: 600; font-family: inherit; border: none; border-radius: 6px; cursor: pointer; }
      .sidebar-nav { flex: 1; padding: 12px 0; }
      .nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 20px; font-size: 13.5px; color: var(--gray-700); text-decoration: none; cursor: pointer; border-left: 3px solid transparent; transition: background .15s, color .15s; user-select: none; }
      .nav-link:hover { background: var(--blue-bg); color: var(--blue); }
      .nav-link.active { background: var(--blue-bg); color: var(--blue); font-weight: 600; border-left-color: var(--blue); }
      .nav-link svg { opacity: .6; flex-shrink: 0; }
      .nav-link:hover svg, .nav-link.active svg { opacity: 1; }
      .sidebar-footer { padding: 12px 20px; border-top: 1px solid var(--gray-200); font-size: 11px; color: var(--gray-400); }
      .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
      .topbar { height: var(--header-h); background: var(--white); border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; padding: 0 24px; gap: 12px; position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow); }
      .hamburger { display: none; flex-direction: column; gap: 4px; cursor: pointer; padding: 4px; }
      .hamburger span { display: block; width: 20px; height: 2px; background: var(--gray-700); border-radius: 2px; }
      .back-btn { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--gray-700); background: var(--gray-100); border: 1px solid var(--gray-200); border-radius: 7px; padding: 5px 12px; cursor: pointer; text-decoration: none; }
      .back-btn:hover { background: var(--gray-200); }
      .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
      .icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--gray-200); background: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: var(--gray-600); }
      .notif-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); border: 2px solid var(--white); }
      .topbar-av { width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: var(--white); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
      .content { padding: 24px; flex: 1; }
      .page-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
      .page-hdr-left { display: flex; align-items: center; gap: 10px; }
      .page-hdr-left svg { color: var(--blue); }
      .page-hdr-title { font-size: 17px; font-weight: 700; }
      .new-post-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--blue); color: var(--white); font-size: 13px; font-weight: 600; font-family: inherit; border: none; border-radius: 8px; cursor: pointer; transition: background .15s; }
      .new-post-btn:hover { background: var(--blue-dark); }

      /* BLOG LAYOUT */
      .blog-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
      .posts-list { display: flex; flex-direction: column; gap: 14px; }
      .post-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--gray-200); box-shadow: var(--shadow); padding: 20px; cursor: pointer; transition: box-shadow .2s; }
      .post-card:hover { box-shadow: var(--shadow-md); }
      .post-title { font-size: 16px; font-weight: 700; color: var(--gray-800); margin-bottom: 6px; }
      .post-meta { font-size: 12px; color: var(--gray-400); margin-bottom: 10px; }
      .post-excerpt { font-size: 13px; color: var(--gray-600); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      .post-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-100); }
      .visibility-tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: var(--blue-bg); color: var(--blue); }
      .read-more { font-size: 12px; color: var(--blue); font-weight: 600; }

      /* POST DETAIL (right side) */
      .post-detail { background: var(--white); border-radius: var(--radius); border: 1px solid var(--gray-200); box-shadow: var(--shadow); position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto; }
      .post-detail-inner { padding: 20px; }
      .post-detail-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
      .post-detail-meta  { font-size: 12px; color: var(--gray-400); margin-bottom: 16px; }
      .post-detail-body  { font-size: 14px; line-height: 1.7; color: var(--gray-700); white-space: pre-wrap; }
      .post-placeholder  { padding: 40px 20px; text-align: center; color: var(--gray-400); font-size: 13px; }
      .post-placeholder svg { color: var(--gray-300); margin-bottom: 10px; }

      /* COMPOSE MODAL */
      .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 300; align-items: center; justify-content: center; }
      .modal-overlay.show { display: flex; }
      .modal { background: var(--white); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 600px; box-shadow: var(--shadow-md); max-height: 90vh; overflow-y: auto; }
      .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
      .form-group { margin-bottom: 14px; }
      .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-600); margin-bottom: 5px; }
      .form-input, .form-textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--gray-200); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; color: var(--gray-800); transition: border-color .15s; }
      .form-input:focus, .form-textarea:focus { border-color: var(--blue); }
      .form-textarea { resize: vertical; min-height: 160px; line-height: 1.6; }
      .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
      .btn-cancel { padding: 8px 16px; background: var(--white); color: var(--gray-600); border: 1px solid var(--gray-200); border-radius: 7px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
      .btn-publish { padding: 8px 16px; background: var(--blue); color: var(--white); border: none; border-radius: 7px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
      .btn-publish:hover { background: var(--blue-dark); }
      .success-msg { background: var(--green-bg); color: var(--green); font-size: 13px; padding: 10px 14px; border-radius: 7px; margin-bottom: 14px; display: none; }
      .error-msg   { background: var(--red-bg); color: var(--red); font-size: 13px; padding: 10px 14px; border-radius: 7px; margin-bottom: 14px; display: none; }
      .notice-bar { background: var(--amber-bg); border: 1px solid #fde68a; color: var(--amber); font-size: 13px; padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; }
      .empty-state { padding: 48px; text-align: center; color: var(--gray-400); font-size: 13px; }
      .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 90; }
      .overlay.show { display: block; }

      @media (max-width: 960px) { .blog-layout { grid-template-columns: 1fr; } .post-detail { position: static; max-height: none; } }
      @media (max-width: 768px) {
        .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,.12); }
        .main { margin-left: 0; } .hamburger { display: flex; } .content { padding: 16px; } .back-btn { display: none; }
      }
    </style>
  </head>
  <body>
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- NEW POST MODAL -->
  <div class="modal-overlay" id="postModal">
    <div class="modal">
      <div class="modal-title">New Blog Post</div>
      <div class="success-msg" id="postSuccess">Post published successfully!</div>
      <div class="error-msg"   id="postError"></div>
      <div class="notice-bar"> Your post will be visible to your personal tutor only.</div>
      <div class="form-group">
        <label class="form-label">Title</label>
        <input class="form-input" id="postTitle" type="text" placeholder="Enter a title for your post" />
      </div>
      <div class="form-group">
        <label class="form-label">Content</label>
        <textarea class="form-textarea" id="postBody" placeholder="Write your blog post here..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-publish" onclick="publishPost()">Publish Post</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-profile">
        <div class="profile-pic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>
        <div class="profile-name" id="profileName">—</div>
        <div class="profile-role">Student</div>
        <button class="btn-profile">View Profile</button>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-link" href="../student-dashboard.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
        <a class="nav-link" href="messages.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Messages</a>
        <a class="nav-link" href="meetings.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Meetings</a>
        <a class="nav-link" href="documents.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>Documents</a>
        <a class="nav-link active"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Blog</a>
        <a class="nav-link" href="profile.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>Profile &amp; Settings</a>
      </nav>
      <div class="sidebar-footer">© 2026 eTutor</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="hamburger" onclick="openSidebar()"><span></span><span></span><span></span></div>
        <a class="back-btn" href="../student-dashboard.html"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>Back</a>
        <div class="topbar-right">
          <div class="icon-btn"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot"></span></div>
          <div class="topbar-av" id="topbarAv">—</div>
          <button id="signOutBtn" onclick="logoutUser()" style="display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;font-family:inherit;background:var(--white);color:var(--gray-600);border:1px solid var(--gray-200);cursor:pointer;">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out
          </button>
        </div>
      </header>
      <div class="content">
        <div class="page-hdr">
          <div class="page-hdr-left">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span class="page-hdr-title">Blog</span>
          </div>
          <button class="new-post-btn" onclick="openModal()">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Post
          </button>
        </div>
        <div class="blog-layout">
          <div class="posts-list" id="postsList"><div class="empty-state">Loading posts...</div></div>
          <div class="post-detail" id="postDetail">
            <div class="post-placeholder">
              <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              <div>Select a post to read</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

    <script>
    const API_BASE = 'http://localhost:5188';
    const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    if (!currentUser) window.location.href = '../login.html';
    function authHeaders() { return { 'Content-Type': 'application/json', 'Authorization': JSON.stringify(currentUser) }; }

    // ── PROFILE ─────────────────────────────────────────────────
    const username = currentUser.username || 'Student';
    document.getElementById('profileName').textContent = username;
    document.getElementById('topbarAv').textContent = username.substring(0, 2).toUpperCase();
    (async () => {
      try {
        const r = await fetch(`${API_BASE}/User/dashboard/${currentUser.id}`, { headers: authHeaders() });
        if (r.ok) {
          const p = await r.json();
          const dn = p.fullName || p.username || username;
          document.getElementById('profileName').textContent = dn;
          document.getElementById('topbarAv').textContent = dn.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
        }
      } catch(e) {}
    })();

    // ── STATE ────────────────────────────────────────────────────
    let allPosts = [];
    let editingPostId = null;

    // ── HELPERS ──────────────────────────────────────────────────
    function timeAgo(str) {
      const diff = Math.floor((Date.now() - new Date(str)) / 60000);
      if (diff < 1) return 'Just now'; if (diff < 60) return `${diff}m ago`;
      if (diff < 1440) return `${Math.floor(diff/60)}h ago`; return `${Math.floor(diff/1440)}d ago`;
    }

    // ── LOAD POSTS ───────────────────────────────────────────────
    async function loadPosts() {
      document.getElementById('postsList').innerHTML = '<div class="empty-state">Loading posts...</div>';
      try {
        const res = await fetch(`${API_BASE}/Blog/my-posts`, { headers: authHeaders() });
        if (res.ok) {
          allPosts = await res.json();
          renderPosts();
        } else {
          document.getElementById('postsList').innerHTML = '<div class="empty-state">Could not load posts</div>';
        }
      } catch(e) {
        document.getElementById('postsList').innerHTML = '<div class="empty-state">Could not reach the server</div>';
      }
    }

    // ── RENDER POST LIST ─────────────────────────────────────────
    function renderPosts() {
      const list = document.getElementById('postsList');
      if (allPosts.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <div>No blog posts yet</div>
            <div style="margin-top:8px;font-size:12px">Click "New Post" to write your first entry</div>
          </div>`;
        return;
      }
      list.innerHTML = allPosts.map(p => `
        <div class="post-card" onclick='openPost(${JSON.stringify(p).replace(/'/g,"&#39;")})'>
          <div class="post-title">${p.title || 'Untitled'}</div>
          <div class="post-meta">Posted ${timeAgo(p.createdAt)}</div>
          <div class="post-excerpt">${p.content || ''}</div>
          <div class="post-footer">
            <span class="visibility-tag">Visible to tutor</span>
            <div style="display:flex;gap:8px;align-items:center">
              <button onclick="event.stopPropagation();openEdit(${JSON.stringify(p).replace(/'/g,"&#39;")})" style="background:none;border:none;font-size:12px;color:var(--blue);cursor:pointer;font-weight:600">Edit</button>
              <button onclick="event.stopPropagation();deletePost(${p.id})" style="background:none;border:none;font-size:12px;color:var(--red);cursor:pointer;font-weight:600">Delete</button>
              <span class="read-more">Read more →</span>
            </div>
          </div>
        </div>`).join('');
    }

    // ── OPEN POST DETAIL ─────────────────────────────────────────
    function openPost(post) {
      const panel = document.getElementById('postDetail');
      panel.innerHTML = `
        <div class="post-detail-inner">
          <div class="post-detail-title">${post.title || 'Untitled'}</div>
          <div class="post-detail-meta">Posted ${timeAgo(post.createdAt)} &nbsp;·&nbsp; Visible to your tutor</div>
          <div class="post-detail-body">${post.content || ''}</div>
          <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--gray-100)">
            <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-400);margin-bottom:10px">Comments</div>
            <div id="commentsArea" style="margin-bottom:14px">
              ${(post.comments && post.comments.length > 0)
                ? post.comments.map(c => `
                    <div style="padding:10px 0;border-bottom:1px solid var(--gray-100)">
                      <div style="font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:3px">User #${c.authorId} &nbsp;<span style="font-weight:400;color:var(--gray-400)">${timeAgo(c.createdAt)}</span></div>
                      <div style="font-size:13px;color:var(--gray-700)">${c.content}</div>
                    </div>`).join('')
                : '<div style="font-size:13px;color:var(--gray-400)">No comments yet</div>'}
            </div>
            <div style="display:flex;gap:8px">
              <input id="commentInput" type="text" placeholder="Add a comment..." style="flex:1;padding:8px 12px;border:1px solid var(--gray-200);border-radius:8px;font-size:13px;font-family:inherit;outline:none"/>
              <button onclick="postComment(${post.id})" style="padding:8px 14px;background:var(--blue);color:var(--white);border:none;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer">Post</button>
            </div>
          </div>
        </div>`;
    }

    // ── POST COMMENT ─────────────────────────────────────────────
    async function postComment(postId) {
      const input = document.getElementById('commentInput');
      const content = input.value.trim();
      if (!content) return;
      try {
        const res = await fetch(`${API_BASE}/Blog/${postId}/comment`, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ content, parentCommentId: 0 })
        });
        if (res.ok) {
          input.value = '';
          await loadPosts();
          // Re-open the same post to show new comment
          const updated = allPosts.find(p => p.id === postId);
          if (updated) openPost(updated);
        }
      } catch(e) { console.error(e); }
    }

    // ── NEW POST MODAL ───────────────────────────────────────────
    function openModal() {
      editingPostId = null;
      document.getElementById('postModal').classList.add('show');
      document.querySelector('.modal-title').textContent = 'New Blog Post';
      document.querySelector('.btn-publish').textContent = 'Publish Post';
      document.getElementById('postSuccess').style.display = 'none';
      document.getElementById('postError').style.display = 'none';
      document.getElementById('postTitle').value = '';
      document.getElementById('postBody').value = '';
    }

    function openEdit(post) {
      editingPostId = post.id;
      document.getElementById('postModal').classList.add('show');
      document.querySelector('.modal-title').textContent = 'Edit Post';
      document.querySelector('.btn-publish').textContent = 'Save Changes';
      document.getElementById('postSuccess').style.display = 'none';
      document.getElementById('postError').style.display = 'none';
      document.getElementById('postTitle').value = post.title || '';
      document.getElementById('postBody').value = post.content || '';
    }

    function closeModal() { document.getElementById('postModal').classList.remove('show'); }

    // ── PUBLISH / UPDATE ─────────────────────────────────────────
    async function publishPost() {
      const title   = document.getElementById('postTitle').value.trim();
      const content = document.getElementById('postBody').value.trim();
      const errEl   = document.getElementById('postError');
      const sucEl   = document.getElementById('postSuccess');
      if (!title || !content) { errEl.textContent = 'Please enter both a title and content.'; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';

      try {
        let res;
        if (editingPostId) {
          // UPDATE existing post
          res = await fetch(`${API_BASE}/Blog/update/${editingPostId}`, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({ title, content, status: 0 })
          });
        } else {
          // CREATE new post
          res = await fetch(`${API_BASE}/Blog/create`, {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({ title, content, status: 0 })
          });
        }

        if (res.ok) {
          sucEl.textContent = editingPostId ? 'Post updated successfully!' : 'Post published successfully!';
          sucEl.style.display = 'block';
          await loadPosts();
          setTimeout(closeModal, 1200);
        } else {
          errEl.textContent = 'Something went wrong. Please try again.';
          errEl.style.display = 'block';
        }
      } catch(e) {
        errEl.textContent = 'Could not reach the server.';
        errEl.style.display = 'block';
      }
    }

    // ── DELETE ───────────────────────────────────────────────────
    async function deletePost(postId) {
      if (!confirm('Are you sure you want to delete this post?')) return;
      try {
        const res = await fetch(`${API_BASE}/Blog/delete/${postId}`, {
          method: 'DELETE',
          headers: authHeaders()
        });
        if (res.ok) {
          // Clear detail panel if deleted post was open
          document.getElementById('postDetail').innerHTML = `
            <div class="post-placeholder">
              <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              <div>Select a post to read</div>
            </div>`;
          await loadPosts();
        }
      } catch(e) { console.error(e); }
    }

    // ── AUTH / SIDEBAR ───────────────────────────────────────────
    async function logoutUser() {
      try { await fetch(`${API_BASE}/Authentication/logout/${currentUser.id}`, { method: 'POST', headers: authHeaders() }); } catch(e) {}
      localStorage.clear(); window.location.href = '../login.html';
    }
    function openSidebar()  { document.getElementById('sidebar').classList.add('open');    document.getElementById('overlay').classList.add('show'); }
    function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
    const sob = document.getElementById('signOutBtn');
    sob.addEventListener('mouseover', () => { sob.style.background='#fee2e2'; sob.style.color='#dc2626'; sob.style.borderColor='#fecaca'; });
    sob.addEventListener('mouseout',  () => { sob.style.background='var(--white)'; sob.style.color='var(--gray-600)'; sob.style.borderColor='var(--gray-200)'; });

    loadPosts();
  </script>
  </body>
</html>
