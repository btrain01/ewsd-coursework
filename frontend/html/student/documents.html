<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eTutor — Documents</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --blue: #1a56db; --blue-dark: #1a3a6b; --blue-bg: #e8f0fe;
        --white: #ffffff; --gray-50: #f8fafc; --gray-100: #f1f5f9;
        --gray-200: #e2e8f0; --gray-300: #d1d5db; --gray-400: #94a3b8;
        --gray-500: #6b7280; --gray-700: #374151; --gray-800: #1f2937;
        --green: #16a34a; --green-bg: #dcfce7; --amber: #d97706;
        --amber-bg: #fef3c7; --red: #dc2626; --red-bg: #fee2e2;
        --sidebar-w: 240px; --header-h: 60px; --radius: 12px;
        --shadow: 0 1px 4px rgba(0,0,0,.07); --shadow-md: 0 4px 16px rgba(0,0,0,.10);
      }
      body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--gray-100); color: var(--gray-800); min-height: 100vh; }
      .layout { display: flex; min-height: 100vh; }
      .sidebar { width: var(--sidebar-w); background: var(--white); border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform .25s ease; }
      .sidebar-profile { padding: 24px 20px 20px; display: flex; flex-direction: column; align-items: center; border-bottom: 1px solid var(--gray-200); }
      .profile-pic { width: 72px; height: 72px; border-radius: 50%; background: var(--blue-bg); border: 3px solid var(--blue); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
      .profile-pic svg { color: var(--blue); }
      .profile-name { font-size: 14px; font-weight: 700; }
      .profile-role { font-size: 11px; color: var(--gray-500); margin-top: 2px; }
      .btn-profile { margin-top: 12px; padding: 6px 20px; background: var(--blue); color: var(--white); font-size: 12px; font-weight: 600; font-family: inherit; border: none; border-radius: 6px; cursor: pointer; }
      .sidebar-nav { flex: 1; padding: 12px 0; }
      .nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 20px; font-size: 13.5px; color: var(--gray-700); text-decoration: none; cursor: pointer; border-left: 3px solid transparent; transition: background .15s, color .15s; user-select: none; }
      .nav-link:hover { background: var(--blue-bg); color: var(--blue); }
      .nav-link.active { background: var(--blue-bg); color: var(--blue); font-weight: 600; border-left-color: var(--blue); }
      .nav-link svg { opacity: .6; flex-shrink: 0; }
      .nav-link:hover svg, .nav-link.active svg { opacity: 1; }
      .sidebar-footer { padding: 12px 20px; border-top: 1px solid var(--gray-200); font-size: 11px; color: var(--gray-400); }
      .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
      .topbar { height: var(--header-h); background: var(--white); border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; padding: 0 24px; gap: 12px; position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow); }
      .hamburger { display: none; flex-direction: column; gap: 4px; cursor: pointer; padding: 4px; }
      .hamburger span { display: block; width: 20px; height: 2px; background: var(--gray-700); border-radius: 2px; }
      .back-btn { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--gray-700); background: var(--gray-100); border: 1px solid var(--gray-200); border-radius: 7px; padding: 5px 12px; cursor: pointer; text-decoration: none; }
      .back-btn:hover { background: var(--gray-200); }
      .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
      .icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--gray-200); background: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: var(--gray-600); }
      .notif-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); border: 2px solid var(--white); }
      .topbar-av { width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: var(--white); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
      .content { padding: 24px; flex: 1; }
      .page-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
      .page-hdr-left { display: flex; align-items: center; gap: 10px; }
      .page-hdr-left svg { color: var(--blue); }
      .page-hdr-title { font-size: 17px; font-weight: 700; }

      /* DOCUMENTS TABLE */
      .docs-panel { background: var(--white); border-radius: var(--radius); border: 1px solid var(--gray-200); box-shadow: var(--shadow); overflow: hidden; }
      .docs-toolbar { padding: 12px 16px; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .search-input { flex: 1; min-width: 180px; padding: 7px 12px; border: 1px solid var(--gray-200); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; background: var(--gray-50); }
      .search-input:focus { border-color: var(--blue); background: var(--white); }
      .doc-row { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-bottom: 1px solid var(--gray-100); transition: background .15s; }
      .doc-row:last-child { border-bottom: none; }
      .doc-row:hover { background: var(--gray-50); }
      .doc-icon { width: 38px; height: 38px; border-radius: 9px; background: var(--blue-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .doc-icon svg { color: var(--blue); }
      .doc-info { flex: 1; min-width: 0; }
      .doc-name { font-size: 13px; font-weight: 600; color: var(--gray-800); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .doc-meta { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
      .doc-size { font-size: 12px; color: var(--gray-400); white-space: nowrap; flex-shrink: 0; }
      .doc-actions { display: flex; gap: 6px; flex-shrink: 0; }
      .btn-dl { display: flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; background: var(--blue-bg); color: var(--blue); border: none; transition: background .15s; }
      .btn-dl:hover { background: var(--blue-bg); opacity: .8; }
      .empty-state { padding: 48px; text-align: center; color: var(--gray-400); font-size: 13px; }
      .empty-state svg { color: var(--gray-300); margin-bottom: 10px; }
      .notice-bar { background: var(--amber-bg); border: 1px solid #fde68a; color: var(--amber); font-size: 13px; padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; }
      .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 90; }
      .overlay.show { display: block; }
      @media (max-width: 768px) {
        .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,.12); }
        .main { margin-left: 0; } .hamburger { display: flex; } .content { padding: 16px; } .back-btn { display: none; }
        .doc-size { display: none; }
      }

      .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 300; align-items: center; justify-content: center; }
      .modal-overlay.show { display: flex; }
      .modal { background: var(--white); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 480px; box-shadow: var(--shadow-md); }
      .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
      .form-group { margin-bottom: 14px; }
      .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-600); margin-bottom: 5px; }
      .form-input { width: 100%; padding: 9px 12px; border: 1px solid var(--gray-200); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; color: var(--gray-800); transition: border-color .15s; }
      .form-input:focus { border-color: var(--blue); }
      .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
      .btn-cancel { padding: 8px 16px; background: var(--white); color: var(--gray-600); border: 1px solid var(--gray-200); border-radius: 7px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
      .btn-publish { padding: 8px 16px; background: var(--blue); color: var(--white); border: none; border-radius: 7px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
      .btn-publish:hover { background: var(--blue-dark); }
      .btn-publish:disabled { opacity: .6; cursor: not-allowed; }
      .success-msg { background: var(--green-bg); color: var(--green); font-size: 13px; padding: 10px 14px; border-radius: 7px; margin-bottom: 14px; display: none; }
      .error-msg   { background: var(--red-bg);   color: var(--red);   font-size: 13px; padding: 10px 14px; border-radius: 7px; margin-bottom: 14px; display: none; }
    </style>
  </head>
  <body>
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-profile">
        <div class="profile-pic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>
        <div class="profile-name" id="profileName">—</div>
        <div class="profile-role">Student</div>
        <button class="btn-profile">View Profile</button>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-link" href="../student-dashboard.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
                <a class="nav-link" href="messages.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Messages</a>
        <a class="nav-link" href="meetings.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Meetings</a>
        <a class="nav-link active"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>Documents</a>
        <a class="nav-link" href="blog.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Blog</a>
        <a class="nav-link" href="profile.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>Profile &amp; Settings</a>
      </nav>
      <div class="sidebar-footer">© 2026 eTutor</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="hamburger" onclick="openSidebar()"><span></span><span></span><span></span></div>
        <a class="back-btn" href="../student-dashboard.html"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>Back</a>
        <div class="topbar-right">
          <div class="icon-btn"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot"></span></div>
          <div class="topbar-av" id="topbarAv">—</div>
          <button id="signOutBtn" onclick="logoutUser()" style="display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;font-family:inherit;background:var(--white);color:var(--gray-600);border:1px solid var(--gray-200);cursor:pointer;">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out
          </button>
        </div>
      </header>
      <div class="content">
        <div class="page-hdr">
          <div class="page-hdr-left">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
            <span class="page-hdr-title">Documents</span>
          </div>
          <button onclick="openUploadModal()" style="display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--blue);color:var(--white);font-size:13px;font-weight:600;font-family:inherit;border:none;border-radius:8px;cursor:pointer;transition:background .15s" onmouseover="this.style.background='var(--blue-dark)'" onmouseout="this.style.background='var(--blue)'">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload Document
          </button>
        </div>

        <div class="docs-panel">
          <div class="docs-toolbar">
            <input class="search-input" type="text" placeholder="Search documents..." oninput="filterDocs(this.value)" />
          </div>
          <div id="docsBody"><div class="empty-state">Loading documents...</div></div>
        </div>
      </div>
    </div>
  </div>
    <!-- UPLOAD MODAL -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal">
      <div class="modal-title">Upload Document</div>
      <div class="success-msg" id="uploadSuccess">Document uploaded successfully!</div>
      <div class="error-msg"   id="uploadError"></div>
      <div class="form-group">
        <label class="form-label">File</label>
        <input class="form-input" type="file" id="fileInput" style="padding:7px 12px;cursor:pointer"/>
      </div>
      <div class="form-group">
        <label class="form-label">Attach to Meeting</label>
        <select class="form-input" id="meetingSelect" style="cursor:pointer">
          <option value="" disabled selected>Select a meeting...</option>
        </select>
        <div style="font-size:11px;color:var(--gray-400);margin-top:4px">Documents must be linked to a meeting. Load your meetings first if none appear.</div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeUploadModal()">Cancel</button>
        <button class="btn-publish" id="uploadBtn" onclick="uploadDocument()">Upload</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5188';
    const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    if (!currentUser) window.location.href = '../login.html';
    function authHeaders() { return { 'Content-Type': 'application/json', 'Authorization': JSON.stringify(currentUser) }; }
    // Note: upload uses multipart so no Content-Type header — browser sets boundary automatically
    function authHeadersMultipart() { return { 'Authorization': JSON.stringify(currentUser) }; }

    // ── PROFILE ──────────────────────────────────────────────────
    const username = currentUser.username || 'Student';
    document.getElementById('profileName').textContent = username;
    document.getElementById('topbarAv').textContent = username.substring(0, 2).toUpperCase();
    (async () => {
      try {
        const r = await fetch(`${API_BASE}/User/dashboard/${currentUser.id}`, { headers: authHeaders() });
        if (r.ok) {
          const p = await r.json();
          const dn = p.fullName || p.username || username;
          document.getElementById('profileName').textContent = dn;
          document.getElementById('topbarAv').textContent = dn.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
        }
      } catch(e) {}
    })();

    // ── STATE ────────────────────────────────────────────────────
    let allDocs = [];
    let allMeetings = [];

    // ── HELPERS ──────────────────────────────────────────────────
    function timeAgo(str) {
      const diff = Math.floor((Date.now() - new Date(str)) / 60000);
      if (diff < 1) return 'Just now';
      if (diff < 60) return `${diff}m ago`;
      if (diff < 1440) return `${Math.floor(diff/60)}h ago`;
      return `${Math.floor(diff/1440)}d ago`;
    }

    function mimeIcon(mime) {
      if (!mime) return '📄';
      if (mime.includes('pdf'))   return '📕';
      if (mime.includes('word') || mime.includes('doc'))  return '📘';
      if (mime.includes('sheet') || mime.includes('excel') || mime.includes('csv')) return '📗';
      if (mime.includes('image')) return '🖼';
      if (mime.includes('zip') || mime.includes('compressed')) return '📦';
      return '📄';
    }

    function mimeLabel(mime) {
      if (!mime) return 'File';
      if (mime.includes('pdf'))   return 'PDF';
      if (mime.includes('word') || mime.includes('docx')) return 'Word';
      if (mime.includes('sheet') || mime.includes('excel')) return 'Excel';
      if (mime.includes('csv'))   return 'CSV';
      if (mime.includes('image')) return 'Image';
      if (mime.includes('text'))  return 'Text';
      if (mime.includes('zip'))   return 'Archive';
      return mime.split('/').pop()?.toUpperCase() || 'File';
    }

    // ── LOAD DOCUMENTS ───────────────────────────────────────────
    async function loadDocs() {
      try {
        const res = await fetch(`${API_BASE}/Document/my-documents`, { headers: authHeaders() });
        if (res.ok) {
          allDocs = await res.json();
          renderDocs();
        } else {
          document.getElementById('docsBody').innerHTML = '<div class="empty-state">Could not load documents</div>';
        }
      } catch(e) {
        document.getElementById('docsBody').innerHTML = '<div class="empty-state">Could not reach the server</div>';
      }
    }

    // ── RENDER DOCUMENTS ─────────────────────────────────────────
    // DocumentResponse shape: { id, uploaderId, meetingId, fileName, mimePath, createdAt, updatedAt }
    function renderDocs(filter = '') {
      let docs = allDocs;
      if (filter) {
        const q = filter.toLowerCase();
        docs = docs.filter(d => (d.fileName || '').toLowerCase().includes(q));
      }
      const body = document.getElementById('docsBody');
      if (docs.length === 0) {
        body.innerHTML = `<div class="empty-state">
          <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14,2 14,8 20,8"/>
          </svg>
          <div>No documents found</div>
        </div>`;
        return;
      }
      body.innerHTML = docs.map(d => `
        <div class="doc-row">
          <div class="doc-icon">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14,2 14,8 20,8"/>
            </svg>
          </div>
          <div class="doc-info">
            <div class="doc-name">${d.fileName || 'Untitled'}</div>
            <div class="doc-meta">
              <span style="background:var(--blue-bg);color:var(--blue);font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px;margin-right:6px">${mimeLabel(d.mimePath)}</span>
              Meeting #${d.meetingId} &nbsp;·&nbsp; ${timeAgo(d.createdAt)}
            </div>
          </div>
          <div class="doc-actions">
            <button class="btn-dl" onclick="downloadDocument(${d.id}, '${(d.fileName || 'document').replace(/'/g,"\'")}')">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7,10 12,15 17,10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              Download
            </button>
          </div>
        </div>`).join('');
    }

    function filterDocs(val) { renderDocs(val); }

    // ── DOWNLOAD ─────────────────────────────────────────────────
    async function downloadDocument(docId, fileName) {
      try {
        const res = await fetch(`${API_BASE}/Document/download/${docId}`, { headers: authHeaders() });
        if (res.ok) {
          const blob = await res.blob();
          const url  = URL.createObjectURL(blob);
          const a    = document.createElement('a');
          a.href     = url;
          a.download = fileName || `document_${docId}`;
          a.click();
          URL.revokeObjectURL(url);
        } else {
          alert('Could not download document.');
        }
      } catch(e) { console.error(e); }
    }

    // ── UPLOAD MODAL ─────────────────────────────────────────────
    async function openUploadModal() {
      document.getElementById('uploadModal').classList.add('show');
      document.getElementById('uploadSuccess').style.display = 'none';
      document.getElementById('uploadError').style.display   = 'none';
      document.getElementById('fileInput').value = '';

      // Load meetings into dropdown so user can pick which meeting to attach to
      const select = document.getElementById('meetingSelect');
      select.innerHTML = '<option value="" disabled selected>Loading meetings...</option>';
      try {
        const res = await fetch(`${API_BASE}/User/meetings/${currentUser.id}`, { headers: authHeaders() });
        if (res.ok) {
          allMeetings = await res.json();
          if (allMeetings.length === 0) {
            select.innerHTML = '<option value="" disabled selected>No meetings found — schedule one first</option>';
          } else {
            select.innerHTML = '<option value="" disabled selected>Select a meeting...</option>' +
              allMeetings.map(m => `<option value="${m.id}">${m.agenda || 'Meeting'} — ${new Date(m.scheduledAt).toLocaleDateString('en-GB')}</option>`).join('');
          }
        }
      } catch(e) {
        select.innerHTML = '<option value="" disabled selected>Could not load meetings</option>';
      }
    }

    function closeUploadModal() { document.getElementById('uploadModal').classList.remove('show'); }

    // ── UPLOAD DOCUMENT ──────────────────────────────────────────
    async function uploadDocument() {
      const fileInput = document.getElementById('fileInput');
      const meetingId = document.getElementById('meetingSelect').value;
      const errEl     = document.getElementById('uploadError');
      const sucEl     = document.getElementById('uploadSuccess');
      errEl.style.display = 'none';

      if (!fileInput.files || fileInput.files.length === 0) {
        errEl.textContent = 'Please select a file.';
        errEl.style.display = 'block'; return;
      }
      if (!meetingId) {
        errEl.textContent = 'Please select a meeting to attach this document to.';
        errEl.style.display = 'block'; return;
      }

      const formData = new FormData();
      formData.append('File', fileInput.files[0]);
      formData.append('MeetingId', meetingId);

      document.getElementById('uploadBtn').disabled = true;
      try {
        const res = await fetch(`${API_BASE}/Document/upload`, {
          method: 'POST',
          headers: authHeadersMultipart(),  // No Content-Type — browser sets multipart boundary
          body: formData
        });
        if (res.ok) {
          sucEl.style.display = 'block';
          await loadDocs();
          setTimeout(closeUploadModal, 1500);
        } else {
          const text = await res.text();
          errEl.textContent = text || 'Upload failed. Please try again.';
          errEl.style.display = 'block';
        }
      } catch(e) {
        errEl.textContent = 'Could not reach the server.';
        errEl.style.display = 'block';
      }
      document.getElementById('uploadBtn').disabled = false;
    }

    // ── AUTH / SIDEBAR ───────────────────────────────────────────
    async function logoutUser() {
      try { await fetch(`${API_BASE}/Authentication/logout/${currentUser.id}`, { method: 'POST', headers: authHeaders() }); } catch(e) {}
      localStorage.removeItem('currentUser'); localStorage.removeItem('registeredUsername');
      window.location.href = '../login.html';
    }
    function openSidebar()  { document.getElementById('sidebar').classList.add('open');    document.getElementById('overlay').classList.add('show'); }
    function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
    const sob = document.getElementById('signOutBtn');
    sob.addEventListener('mouseover', () => { sob.style.background='#fee2e2'; sob.style.color='#dc2626'; sob.style.borderColor='#fecaca'; });
    sob.addEventListener('mouseout',  () => { sob.style.background='var(--white)'; sob.style.color='var(--gray-600)'; sob.style.borderColor='var(--gray-200)'; });

    loadDocs();
  </script>
  </body>
