<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eTutor — Meetings</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --blue: #1a56db; --blue-dark: #1a3a6b; --blue-bg: #e8f0fe;
        --white: #ffffff; --gray-50: #f8fafc; --gray-100: #f1f5f9;
        --gray-200: #e2e8f0; --gray-300: #d1d5db; --gray-400: #94a3b8;
        --gray-500: #6b7280; --gray-700: #374151; --gray-800: #1f2937;
        --green: #16a34a; --green-bg: #dcfce7; --amber: #d97706;
        --amber-bg: #fef3c7; --red: #dc2626; --red-bg: #fee2e2;
        --sidebar-w: 240px; --header-h: 60px; --radius: 12px;
        --shadow: 0 1px 4px rgba(0,0,0,.07); --shadow-md: 0 4px 16px rgba(0,0,0,.10);
      }
      body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--gray-100); color: var(--gray-800); min-height: 100vh; }
      .layout { display: flex; min-height: 100vh; }
      .sidebar { width: var(--sidebar-w); background: var(--white); border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform .25s ease; }
      .sidebar-profile { padding: 24px 20px 20px; display: flex; flex-direction: column; align-items: center; border-bottom: 1px solid var(--gray-200); }
      .profile-pic { width: 72px; height: 72px; border-radius: 50%; background: var(--blue-bg); border: 3px solid var(--blue); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
      .profile-pic svg { color: var(--blue); }
      .profile-name { font-size: 14px; font-weight: 700; }
      .profile-role { font-size: 11px; color: var(--gray-500); margin-top: 2px; }
      .btn-profile { margin-top: 12px; padding: 6px 20px; background: var(--blue); color: var(--white); font-size: 12px; font-weight: 600; font-family: inherit; border: none; border-radius: 6px; cursor: pointer; }
      .sidebar-nav { flex: 1; padding: 12px 0; }
      .nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 20px; font-size: 13.5px; color: var(--gray-700); text-decoration: none; cursor: pointer; border-left: 3px solid transparent; transition: background .15s, color .15s; user-select: none; }
      .nav-link:hover { background: var(--blue-bg); color: var(--blue); }
      .nav-link.active { background: var(--blue-bg); color: var(--blue); font-weight: 600; border-left-color: var(--blue); }
      .nav-link svg { opacity: .6; flex-shrink: 0; }
      .nav-link:hover svg, .nav-link.active svg { opacity: 1; }
      .sidebar-footer { padding: 12px 20px; border-top: 1px solid var(--gray-200); font-size: 11px; color: var(--gray-400); }
      .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
      .topbar { height: var(--header-h); background: var(--white); border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; padding: 0 24px; gap: 12px; position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow); }
      .hamburger { display: none; flex-direction: column; gap: 4px; cursor: pointer; padding: 4px; }
      .hamburger span { display: block; width: 20px; height: 2px; background: var(--gray-700); border-radius: 2px; }
      .back-btn { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--gray-700); background: var(--gray-100); border: 1px solid var(--gray-200); border-radius: 7px; padding: 5px 12px; cursor: pointer; text-decoration: none; }
      .back-btn:hover { background: var(--gray-200); }
      .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
      .icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--gray-200); background: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: var(--gray-600); }
      .notif-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); border: 2px solid var(--white); }
      .topbar-av { width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: var(--white); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
      .content { padding: 24px; flex: 1; }
      .page-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
      .page-hdr-left { display: flex; align-items: center; gap: 10px; }
      .page-hdr-left svg { color: var(--blue); }
      .page-hdr-title { font-size: 17px; font-weight: 700; }
      .tabs { display: flex; gap: 2px; background: var(--gray-200); padding: 3px; border-radius: 9px; }
      .tab-btn { padding: 6px 18px; border-radius: 7px; font-size: 13px; font-weight: 600; font-family: inherit; border: none; cursor: pointer; background: transparent; color: var(--gray-500); transition: all .15s; }
      .tab-btn.active { background: var(--white); color: var(--blue); box-shadow: var(--shadow); }
      .new-meeting-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--blue); color: var(--white); font-size: 13px; font-weight: 600; font-family: inherit; border: none; border-radius: 8px; cursor: pointer; transition: background .15s; }
      .new-meeting-btn:hover { background: var(--blue-dark); }

      /* MEETING CARDS */
      .meetings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
      .meeting-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--gray-200); box-shadow: var(--shadow); padding: 18px 20px; transition: box-shadow .2s; }
      .meeting-card:hover { box-shadow: var(--shadow-md); }
      .meeting-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
      .meeting-title { font-size: 15px; font-weight: 700; color: var(--gray-800); }
      .meeting-agenda { font-size: 12px; color: var(--gray-500); margin-top: 3px; }
      .pill { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
      .pill-pending  { background: var(--amber-bg); color: var(--amber); }
      .pill-virtual  { background: var(--blue-bg);  color: var(--blue); }
      .pill-done     { background: var(--green-bg); color: var(--green); }
      .pill-cancelled{ background: var(--gray-100); color: var(--gray-500); }
      .meeting-detail { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--gray-600); margin-bottom: 6px; }
      .meeting-detail svg { color: var(--gray-400); flex-shrink: 0; }
      .meeting-link-btn { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--blue); text-decoration: none; }
      .meeting-link-btn:hover { text-decoration: underline; }
      .empty-state { padding: 48px; text-align: center; color: var(--gray-400); font-size: 13px; }
      .empty-state svg { color: var(--gray-300); margin-bottom: 10px; }

      /* MODAL */
      .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 300; align-items: center; justify-content: center; }
      .modal-overlay.show { display: flex; }
      .modal { background: var(--white); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 500px; box-shadow: var(--shadow-md); max-height: 90vh; overflow-y: auto; }
      .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
      .form-group { margin-bottom: 14px; }
      .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-600); margin-bottom: 5px; }
      .form-input, .form-select, .form-textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--gray-200); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; color: var(--gray-800); transition: border-color .15s; }
      .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--blue); }
      .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
      .btn-cancel { padding: 8px 16px; background: var(--white); color: var(--gray-600); border: 1px solid var(--gray-200); border-radius: 7px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
      .btn-save { padding: 8px 16px; background: var(--blue); color: var(--white); border: none; border-radius: 7px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
      .btn-save:hover { background: var(--blue-dark); }
      .success-msg { background: var(--green-bg); color: var(--green); font-size: 13px; padding: 10px 14px; border-radius: 7px; margin-bottom: 14px; display: none; }
      .error-msg   { background: var(--red-bg); color: var(--red); font-size: 13px; padding: 10px 14px; border-radius: 7px; margin-bottom: 14px; display: none; }
      .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 90; }
      .overlay.show { display: block; }

      @media (max-width: 768px) {
        .sidebar { transform: translateX(-100%); }
        .sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,.12); }
        .main { margin-left: 0; } .hamburger { display: flex; } .content { padding: 16px; } .back-btn { display: none; }
        .meetings-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- NEW MEETING MODAL -->
  <div class="modal-overlay" id="meetingModal">
    <div class="modal">
      <div class="modal-title">Schedule New Meeting</div>
      <div class="success-msg" id="meetSuccess">Meeting scheduled successfully!</div>
      <div class="error-msg"   id="meetError"></div>
      <div class="form-group">
        <label class="form-label">Meeting Title</label>
        <input class="form-input" id="meetTitle" type="text" placeholder="e.g. Progress Review" />
      </div>
      <div class="form-group">
        <label class="form-label">Description / Agenda</label>
        <textarea class="form-input" id="meetDesc" rows="2" placeholder="What will be discussed?"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date &amp; Time</label>
          <input class="form-input" id="meetDate" type="datetime-local" />
        </div>
        <div class="form-group">
          <label class="form-label">Duration (minutes)</label>
          <input class="form-input" id="meetDuration" type="number" value="60" min="15" max="480" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Meeting Type</label>
          <select class="form-select" id="meetType">
            <option value="VIRTUAL">Virtual</option>
            <option value="PHYSICAL">In-Person</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Location / Link</label>
          <input class="form-input" id="meetLink" type="text" placeholder="URL or room number" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save"   onclick="scheduleMeeting()">Schedule Meeting</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-profile">
        <div class="profile-pic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>
        <div class="profile-name" id="profileName">—</div>
        <div class="profile-role">Personal Tutor</div>
        <button class="btn-profile">View Profile</button>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-link" href="tutor-dashboard.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
        <a class="nav-link" href="my-tutees.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>My Tutees</a>
        <a class="nav-link" href="messages.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Messages</a>
        <a class="nav-link active"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Meetings</a>
        <a class="nav-link" href="documents.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>Documents</a>
        <a class="nav-link" href="blog.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Blog</a>
        <a class="nav-link" href="profile.html"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>Profile &amp; Settings</a>
      </nav>
      <div class="sidebar-footer">© 2026 eTutor</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="hamburger" onclick="openSidebar()"><span></span><span></span><span></span></div>
        <a class="back-btn" href="tutor-dashboard.html"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>Back</a>
        <div class="topbar-right">
          <div class="icon-btn"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot"></span></div>
          <div class="topbar-av" id="topbarAv">—</div>
          <button id="signOutBtn" onclick="logoutUser()" style="display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;font-family:inherit;background:var(--white);color:var(--gray-600);border:1px solid var(--gray-200);cursor:pointer;">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign Out
          </button>
        </div>
      </header>

      <div class="content">
        <div class="page-hdr">
          <div class="page-hdr-left">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span class="page-hdr-title">Meetings</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="tabs">
              <button class="tab-btn active" onclick="switchTab('upcoming', this)">Upcoming</button>
              <button class="tab-btn" onclick="switchTab('past', this)">Past</button>
            </div>
            <button class="new-meeting-btn" onclick="openModal()">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              New Meeting
            </button>
          </div>
        </div>
        <div class="meetings-grid" id="meetingsGrid">
          <div class="empty-state">Loading meetings...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5188';
    const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    if (!currentUser) window.location.href = '../login.html';

    function authHeaders() { return { 'Content-Type': 'application/json', 'Authorization': JSON.stringify(currentUser) }; }

    const username = currentUser.username || 'Student';
    document.getElementById('profileName').textContent = username;
    document.getElementById('topbarAv').textContent = username.substring(0, 2).toUpperCase();

    let allMeetings = [];
    let currentTab = 'upcoming';

    function formatDate(str) { return new Date(str).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' }); }
    function formatTime(str) { return new Date(str).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }

    function statusPill(s) {
      const map = { SCHEDULED: ['pill-pending','Scheduled'], CONFIRMED: ['pill-done','Confirmed'], IN_PROGRESS: ['pill-done','In Progress'], COMPLETED: ['pill-done','Completed'], CANCELLED: ['pill-cancelled','Cancelled'] };
      const [cls, label] = map[s] || ['pill-pending', s];
      return `<span class="pill ${cls}">${label}</span>`;
    }
    function typePill(t) { return t === 'VIRTUAL' ? `<span class="pill pill-virtual">Virtual</span>` : `<span class="pill pill-done">In-Person</span>`; }

    async function loadMeetings() {
      try {
        const res = await fetch(`${API_BASE}/User/meetings/${currentUser.id}`, { headers: authHeaders() });
        if (res.ok) { allMeetings = await res.json(); renderMeetings(); }
        else { document.getElementById('meetingsGrid').innerHTML = '<div class="empty-state">Could not load meetings</div>'; }
      } catch(e) { document.getElementById('meetingsGrid').innerHTML = '<div class="empty-state">Could not reach the server</div>'; }
    }

    function renderMeetings() {
      const now = new Date();
      const filtered = allMeetings.filter(m => {
        const d = new Date(m.scheduledAt);
        return currentTab === 'upcoming' ? (d >= now && m.meetingStatus !== 'CANCELLED' && m.meetingStatus !== 'COMPLETED') : (d < now || m.meetingStatus === 'COMPLETED' || m.meetingStatus === 'CANCELLED');
      });

      const grid = document.getElementById('meetingsGrid');
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state"><svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><div>No ${currentTab} meetings</div></div>`;
        return;
      }

      grid.innerHTML = filtered.map(m => `
        <div class="meeting-card">
          <div class="meeting-card-top">
            <div>
              <div class="meeting-title">${m.agenda || 'Meeting'}</div>
              <div class="meeting-agenda">${m.meetingLink || ''}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
              ${statusPill(m.meetingStatus)}
              ${typePill(m.meetingType)}
            </div>
          </div>
          <div class="meeting-detail">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            ${formatDate(m.scheduledAt)}
          </div>
          <div class="meeting-detail">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
            ${formatTime(m.scheduledAt)} &nbsp;·&nbsp; ${m.durationInMinutes} mins
          </div>
          ${m.meetingLink ? `<a class="meeting-link-btn" href="${m.meetingLink}" target="_blank"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Join Meeting</a>` : ''}
        </div>`).join('');
    }

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderMeetings();
    }

    function openModal()  { document.getElementById('meetingModal').classList.add('show'); document.getElementById('meetSuccess').style.display='none'; document.getElementById('meetError').style.display='none'; }
    function closeModal() { document.getElementById('meetingModal').classList.remove('show'); }

    async function scheduleMeeting() {
      const title    = document.getElementById('meetTitle').value.trim();
      const desc     = document.getElementById('meetDesc').value.trim();
      const dateVal  = document.getElementById('meetDate').value;
      const duration = parseInt(document.getElementById('meetDuration').value);
      const type     = document.getElementById('meetType').value;
      const link     = document.getElementById('meetLink').value.trim();
      const errEl    = document.getElementById('meetError');
      const sucEl    = document.getElementById('meetSuccess');

      if (!title || !dateVal) { errEl.textContent = 'Please enter a title and date.'; errEl.style.display = 'block'; return; }

      errEl.style.display = 'none';
      try {
        const res = await fetch(`${API_BASE}/Meeting/create/${currentUser.id}`, {
          method: 'POST', headers: authHeaders(),
          body: JSON.stringify({ title, description: desc, scheduledAt: new Date(dateVal).toISOString(), durationMinutes: duration, meetingType: type, locationOrUrl: link, meetingStatus: 'SCHEDULED' })
        });
        if (res.ok) {
          sucEl.style.display = 'block';
          await loadMeetings();
          setTimeout(closeModal, 1500);
        } else {
          errEl.textContent = 'Could not schedule meeting. Please try again.';
          errEl.style.display = 'block';
        }
      } catch(e) { errEl.textContent = 'Could not reach the server.'; errEl.style.display = 'block'; }
    }

    async function logoutUser() {
      try { await fetch(`${API_BASE}/Authentication/logout/${currentUser.id}`, { method: 'POST', headers: authHeaders() }); } catch(e) {}
      localStorage.clear(); window.location.href = '../login.html';
    }
    function openSidebar()  { document.getElementById('sidebar').classList.add('open');    document.getElementById('overlay').classList.add('show'); }
    function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }

    const sob = document.getElementById('signOutBtn');
    sob.addEventListener('mouseover', () => { sob.style.background='#fee2e2'; sob.style.color='#dc2626'; sob.style.borderColor='#fecaca'; });
    sob.addEventListener('mouseout',  () => { sob.style.background='var(--white)'; sob.style.color='var(--gray-600)'; sob.style.borderColor='var(--gray-200)'; });

    loadMeetings();
  </script>
  </body>
</html>
